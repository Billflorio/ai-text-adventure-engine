<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI Book-to-Game Engine{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-book-id="{{ book_id | default('') }}">

  <!-- ══════════════════════════════════════════════
       NAV BAR
       ══════════════════════════════════════════════ -->
  <nav class="navbar">
    <div class="nav-left">
      <a class="nav-brand" href="/">📚 AI Book-to-Game Engine</a>
    </div>
    <div class="nav-right">
      {% if current_profile %}
        <span class="nav-profile">
          <span class="nav-profile-icon">👤</span>
          {{ current_profile }}
        </span>
      {% endif %}
      <a class="nav-link {% if request.endpoint == 'library' %}active{% endif %}" href="/">Library</a>
      <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}" href="/settings">Settings</a>
      <a class="nav-link {% if request.endpoint == 'profiles' %}active{% endif %}" href="/profiles">Profiles</a>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════
       MAIN CONTENT BLOCK
       ══════════════════════════════════════════════ -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- ══════════════════════════════════════════════
       GLOBAL TOAST / NOTIFICATION AREA
       ══════════════════════════════════════════════ -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- ══════════════════════════════════════════════
       GAME JAVASCRIPT (loaded last so DOM is ready)
       ══════════════════════════════════════════════ -->
  <script src="/static/game.js"></script>
</body>
</html>
